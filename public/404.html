<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Page Not Found — Fourtiles</title>
    <meta name="description" content="There is no page at this address." />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#8ace00" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#8ace00" media="(prefers-color-scheme: dark)" />

    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-iphone-retina.png" />
    <link rel="mask-icon" href="/pinned-tab.svg" color="#8ace00" />

    <!-- The zone's CSP grants 'unsafe-inline' to `style-src-attr` alone, so a
         `<style>` element here would be blocked and the page would render
         unstyled. The stylesheet is a sibling file that Vite copies out of
         `public/` under a stable, unhashed name. -->
    <link rel="stylesheet" href="/404.css" />
  </head>

  <body>
    <main>
      <h1>
        <span class="code">404</span>
        <span class="label">Page not found</span>
      </h1>

      <p class="lede">There’s no word at this address.</p>

      <section class="puzzle" aria-label="Mini Fourtiles puzzle">
        <div class="word" id="word">
          <span class="ghost" aria-hidden="true"></span>
          <span class="ghost" aria-hidden="true"></span>
          <span class="ghost" aria-hidden="true"></span>
          <span class="ghost" aria-hidden="true"></span>
        </div>

        <div class="board" id="board">
          <div class="slot" style="animation-delay: 0ms">
            <button class="tile" type="button" data-tile="IN">IN</button>
          </div>
          <div class="slot" style="animation-delay: 80ms">
            <button class="tile" type="button" data-tile="G">G</button>
          </div>
          <div class="slot" style="animation-delay: 160ms">
            <button class="tile" type="button" data-tile="SS">SS</button>
          </div>
          <div class="slot" style="animation-delay: 240ms">
            <button class="tile" type="button" data-tile="MI">MI</button>
          </div>
        </div>

        <p class="controls"><button class="reset" id="reset" type="button" hidden>Clear</button></p>

        <p class="announcer" id="announcer" aria-live="polite"></p>
      </section>

      <p><a class="button" href="/">Back to the game</a></p>
    </main>

    <script src="/404.js" defer></script>
  </body>
</html>
